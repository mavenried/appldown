[package]
name = "appldown"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "appldown"
path = "src/main.rs"

[dependencies]
ratatui        = "0.29"
crossterm      = "0.28"
reqwest        = { version = "0.12", features = ["blocking", "json"] }
url            = "2"
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
regex          = "1"
id3            = "1"
anyhow         = "1"
dirs           = "5"
unicode-width  = "0.1"
